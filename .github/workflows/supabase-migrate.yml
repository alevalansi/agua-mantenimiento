name: Supabase Migration

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Also run seed data'
        required: false
        default: 'true'
        type: boolean

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push \
            --db-url "postgresql://postgres.ukejholnrqxyeycevzvt:${SUPABASE_DB_PASSWORD}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres" \
            --workdir .

      - name: Run seed data
        if: ${{ inputs.run_seed == 'true' }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -f supabase/seed.sql ]; then
            PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
              "postgresql://postgres.ukejholnrqxyeycevzvt:${SUPABASE_DB_PASSWORD}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres" \
              -f supabase/seed.sql
          fi
